<meta charset="UTF-8">
<script>
    alert(`
    Exercicio 8:
    Desenvolva um programa que receba dois valores, se o primeiro valor for maior que o segundo
    exibir o dobro do primeiro valor digitado, caso contrário,exibir a metade do segundo valor`);

    var valor1 = parseFloat(prompt("Digite o primeiro valor"));
    var valor2 = parseFloat(prompt("Digite o segundo valor"));

    if (valor1 > valor2) {
        var dobro = valor1 * 2;
        alert(`o dobro do valor 1 é = ${dobro}`);
    }
    else if (valor2 > valor1) {
        var metade = valor2 / 2;
        alert(`a metade do valor 2 é = ${metade}`); 
    }
    else {
        alert(`Nao insira numeros iguais`);
    }

</script>
