<meta charset="UTF-8">
<script>
    alert(` 
    Exercicio 6:
    A jornada de trabalho semanal de um funcionário é de 40 horas. Os funcionários que trabalhar mais de 40 horas receberá hora extra.
    Cujo cálculo é o valor da hora regular com um acréscimo de 50% . 
    Escreva um algoritmo que leia o número de horas trabalhadas em um mes
    o salário por hora e mostre o salário total do funcionário, 
    que deverá ser acrescido das horas extras, caso tenham sido trabalhadas(considere que mes possua 4 semanas exatas)`)

    var valor_hora = parseFloat(prompt("Insira valor que voce ganha por hora"));
    var horas_trabalhadas = parseFloat(prompt("Insira suas horas trabalhadas"));

    var salario_total = horas_trabalhadas * valor_hora;


    if (horas_trabalhadas > 160) {
        var horas_extra = horas_trabalhadas - 160;
        var valor_hora_extra = (horas_extra * valor_hora) / 2;
        var salario_extra = salario_total + valor_hora_extra;

        alert(`O sua quantidade de horas extras foi de ${horas_extra} horas. O valor de horas extra é de R$ ${valor_hora_extra.toFixed(2)}`);
        alert(` O valor total a receber será de R$ ${salario_extra.toFixed(2)}`);
    }

    else {
        alert(`O valor a ser recebido é de R$ ${salario_total.toFixed(3)}`)
    }


</script>
