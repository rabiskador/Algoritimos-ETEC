<meta charset="UTF-8">
<script>
    alert(`
    Exercicio 5:
    Ler dois valores (Considere que não serão lidos valores iguais) e mostre-os em ordem`);

    var valor1 = parseFloat(prompt("Insira o primeiro valor"));
    var valor2 = parseFloat(prompt("Insira o segundo valor"));

    var valor_maior1 = valor1 > valor2;
    var valor_maior2 = valor1 < valor2

    if (valor_maior1) {
        alert(` O primeiro valor digitado é o mais alto = ${valor1} e ${valor2} `);
    }

    else if (valor_maior2){
        alert(` O segundo valor digitado é o mais alto =  ${valor2} e ${valor1}`);
    }

    else {
        alert("Valores são iguais portanto não serão exibido");
    }

</script>
